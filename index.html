* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #0d0e12;
    color: #e4dfd2;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
}

/* Dekorativní pozadí je v samostatné, k viewportu ukotvené
   vrstvě. Dřív bylo namalované přes celý (velmi dlouhý)
   dokument, takže se přechody roztahovaly a diagonální
   šrafování vytvářelo pruhy a artefakty — nejvíc v sekci
   MÉDIA, která je zdaleka nejdelší. */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 20% 0%, rgba(120, 40, 20, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 10%, rgba(20, 60, 90, 0.10) 0%, transparent 55%),
        #0d0e12;
}

.header {
    background:
        linear-gradient(180deg, rgba(90,30,15,0.35) 0%, rgba(13,14,18,0) 60%),
        #14151b;
    border-bottom: 3px solid #7a5a24;
    box-shadow: 0 2px 0 #2c220d, 0 4px 18px rgba(0,0,0,.5);
    position: relative;
}

.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #d6a84f 20%, #f0d68a 50%, #d6a84f 80%, transparent);
    opacity: .8;
}

.header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 26px 18px 20px;
    text-align: center;
}

h1 {
    margin: 0;
    font-family: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #f5dfa0 0%, #d6a84f 45%, #9c7327 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 10px rgba(214,168,79,.15);
}

.subtitle {
    margin-top: 8px;
    color: #a89a78;
    font-size: 13px;
    letter-spacing: .5px;
    font-style: italic;
}

.progress-area {
    margin-top: 18px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
}

.progress-text {
    font-size: 13px;
    color: #aaa;
    margin-bottom: 7px;
}

.progress-bar {
    height: 8px;
    background: #201a10;
    border: 1px solid #4a3a18;
    border-radius: 5px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #9c7327, #f0d68a, #d6a84f);
    box-shadow: 0 0 8px rgba(214,168,79,.5);
    transition: width .25s ease;
}

.loading-note {
    font-size: 12px;
    color: #7a7f89;
    margin-top: 6px;
}


/* =========================
   MAIN
========================= */

.main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 18px 60px;
}


/* =========================
   COLLAPSIBLE SECTIONS
========================= */

.section {
    margin-bottom: 10px;
    background: linear-gradient(180deg, #1a1b21 0%, #17181d 100%);
    border: 1px solid #322818;
    border-radius: 5px;
    overflow: hidden;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    border-left: 3px solid transparent;
    transition: border-color .15s ease, background .15s ease;
}

.section-header:hover {
    background: #20242c;
    border-left-color: #d6a84f;
}

.section-title {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    color: #d9cfb5;
    letter-spacing: .3px;
}

.section-count {
    color: #7a7460;
    font-size: 11px;
    margin-left: auto;
    letter-spacing: .3px;
}

.arrow {
    width: 9px;
    height: 9px;
    border-right: 2px solid #b08a3e;
    border-bottom: 2px solid #b08a3e;
    transform: rotate(45deg);
    transition: transform .2s ease;
    margin-right: 3px;
}

.section.open > .section-header > .arrow {
    transform: rotate(225deg);
}

.section-content {
    display: none;
    padding: 0 12px 12px;
}

.section.open > .section-content {
    display: block;
}


/* =========================
   ITEMS
========================= */

.item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 8px;
    border-top: 1px solid #24211a;
    line-height: 1.4;
    font-size: 14px;
    color: #c9c2ae;
}

.item:first-child {
    border-top: 0;
}

.item input {
    flex: 0 0 auto;
    margin-top: 3px;
    width: 16px;
    height: 16px;
    accent-color: #d6a84f;
    cursor: pointer;
}

.item label {
    cursor: pointer;
    flex: 1;
}

.item.completed label {
    color: #625c4d;
    text-decoration: line-through;
}

/* =========================
   MEDIA
========================= */

.media-category {
    margin-bottom: 12px;
}

.media-category .section-title {
    font-size: 18px;
    color: #f0d68a;
}

.media-category > .section {
    border-color: #4a3a18;
}

/* Skupiny vnořené v kategorii nesmí opakovat stejný svislý
   přechod jako rodičovský panel — vznikaly tím světlejší
   obdélníky, které vypadaly jako poškozené pozadí.
   Uvnitř proto plná barva. */
.media-category .section-content .section {
    background: #191a20;
}


/* =========================
   DOKONČENÁ SEKCE
========================= */

.check {
    display: none;
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    line-height: 17px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #0d0e12;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 9px rgba(74, 222, 128, .45);
}

.section.complete > .section-header > .check {
    display: block;
}

.section.complete > .section-header > .section-title {
    color: #4ade80;
}

.section.complete > .section-header {
    border-left-color: #4ade80;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    h1 {
        font-size: 23px;
    }

    .main {
        padding: 14px 10px 40px;
    }

    .section-header {
        padding: 14px 12px;
    }

    .item {
        font-size: 13px;
    }

}

</style>
</head>

/* =========================================================
   CHECKBOX STORAGE (persistuje mezi sezeními, jen pro tebe)
========================================================= */

const STORAGE_KEY = "warcraft_storyline_checked_v1";

let checkedItems = {};
let storageReady = false;


async function loadCheckedItems() {

    try {

        const raw = window.localStorage.getItem(STORAGE_KEY);

        checkedItems = raw ? JSON.parse(raw) : {};

    } catch (err) {

        checkedItems = {};

    }

    storageReady = true;

}


async function saveCheckedItems() {

    try {

        window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(checkedItems)
        );

    } catch (err) {

        console.error("Uložení se nezdařilo:", err);

    }

}


/* =========================================================
   CHECKBOX
========================================================= */

function makeId(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

}


// Registr všech DOM instancí dané položky, aby se
// zaškrtnutí propsalo okamžitě všude.
let itemRegistry = {};
let idCounters = {};

// Registr sekcí (kategorie a skupiny v médiích), aby
// šlo označit zelenou fajfkou tu, která je celá hotová.
let groupRegistry = [];


function registerGroup(element, ids) {

    if (!ids.length) {
        return;
    }

    groupRegistry.push({
        element: element,
        ids: ids
    });

}


function updateGroupStates() {

    groupRegistry.forEach(function(group) {

        const done = group.ids.every(function(id) {
            return !!checkedItems[id];
        });

        group.element.classList.toggle("complete", done);

    });

}


function createCheckMark() {

    const check = document.createElement("div");

    check.className = "check";

    check.textContent = "✓";

    check.title = "Vše dokončeno";

    return check;

}


function createItem(text) {

    const id = makeId(text);

    if (!itemRegistry[id]) {
        itemRegistry[id] = [];
        idCounters[id] = 0;
    }

    idCounters[id]++;

    const wrapper = document.createElement("div");

    wrapper.className = "item";

    if (checkedItems[id]) {
        wrapper.classList.add("completed");
    }

    const checkbox = document.createElement("input");

    checkbox.type = "checkbox";

    checkbox.checked = !!checkedItems[id];

    // Unikátní DOM id, protože stejná položka se může
    // objevit ve více pohledech současně.
    checkbox.id = "check-" + id + "-" + idCounters[id];

    checkbox.addEventListener("change", function() {

        setChecked(id, checkbox.checked);

    });


    const label = document.createElement("label");

    label.htmlFor = checkbox.id;

    label.textContent = text;


    wrapper.appendChild(checkbox);
    wrapper.appendChild(label);

    itemRegistry[id].push({
        wrapper: wrapper,
        checkbox: checkbox
    });

    return wrapper;

}


function setChecked(id, value) {

    checkedItems[id] = value;

    saveCheckedItems();

    (itemRegistry[id] || []).forEach(function(entry) {

        entry.checkbox.checked = value;

        entry.wrapper.classList.toggle(
            "completed",
            value
        );

    });

    updateProgress();

    updateGroupStates();

}


/* =========================================================
   GENERIC SECTION
========================================================= */

function createSection(title, items) {

    const section = document.createElement("div");

    section.className = "section";


    const header = document.createElement("div");

    header.className = "section-header";


    const titleEl = document.createElement("div");

    titleEl.className = "section-title";

    titleEl.textContent = title;


    const count = document.createElement("div");

    count.className = "section-count";

    count.textContent = items.length + " položek";


    const arrow = document.createElement("div");

    arrow.className = "arrow";


    header.appendChild(createCheckMark());
    header.appendChild(titleEl);
    header.appendChild(count);
    header.appendChild(arrow);


    const content = document.createElement("div");

    content.className = "section-content";


    items.forEach(function(item) {

        content.appendChild(
            createItem(item)
        );

    });


    header.addEventListener("click", function() {

        section.classList.toggle("open");

    });


    section.appendChild(header);
    section.appendChild(content);

    registerGroup(
        section,
        items.map(makeId)
    );

    return section;

}


/* =========================================================
   RENDER MÉDIA
========================================================= */

function renderMedia() {

    const container =
        document.getElementById("mediaContainer");

    container.innerHTML = "";


    mediaData.forEach(function(category) {

        const categorySection =
            document.createElement("div");

        categorySection.className =
            "media-category";


        const section =
            document.createElement("div");

        section.className = "section";


        const header =
            document.createElement("div");

        header.className =
            "section-header";


        const title =
            document.createElement("div");

        title.className =
            "section-title";

        title.textContent =
            category.title;


        const total =
            category.groups.reduce(
                (sum, group) =>
                    sum + group.items.length,
                0
            );


        const count =
            document.createElement("div");

        count.className =
            "section-count";

        count.textContent =
            total + " položek";


        const arrow =
            document.createElement("div");

        arrow.className =
            "arrow";


        header.appendChild(createCheckMark());
        header.appendChild(title);
        header.appendChild(count);
        header.appendChild(arrow);


        const content =
            document.createElement("div");

        content.className =
            "section-content";


        // Kategorie s jedinou skupinou by jinak měla
        // zbytečnou podkategorii se stejným názvem —
        // položky proto vypíšeme rovnou.
        if (category.groups.length === 1) {

            category.groups[0].items
                .forEach(function(item) {

                    content.appendChild(
                        createItem(item)
                    );

                });

        } else {

            category.groups.forEach(function(group) {

                const groupSection =
                    createSection(
                        group.title,
                        group.items
                    );

                content.appendChild(
                    groupSection
                );

            });

        }


        header.addEventListener(
            "click",
            function() {

                section.classList.toggle(
                    "open"
                );

            }
        );


        section.appendChild(header);
        section.appendChild(content);

        registerGroup(
            section,
            category.groups.reduce(
                (ids, group) =>
                    ids.concat(group.items.map(makeId)),
                []
            )
        );

        categorySection.appendChild(section);

        container.appendChild(categorySection);

    });

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const ids = Object.keys(itemRegistry);

    const total = ids.length;

    let completed = 0;

    ids.forEach(function(id) {

        if (checkedItems[id]) {
            completed++;
        }

    });


    const percentage =
        total === 0
            ? 0
            : Math.round(
                completed / total * 100
            );


    document.getElementById(
        "progressText"
    ).textContent =
        completed +
        " / " +
        total +
        " dokončeno";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";

}


/* =========================================================
   RENDER ALL (čistí registr, aby se nekumulovaly staré
   odkazy na smazané DOM elementy)
========================================================= */

function renderAll() {

    itemRegistry = {};
    idCounters = {};
    groupRegistry = [];

    renderMedia();
    updateProgress();
    updateGroupStates();

}


/* =========================================================
   INIT
========================================================= */

async function init() {

    await loadCheckedItems();

    renderAll();

}

init();
