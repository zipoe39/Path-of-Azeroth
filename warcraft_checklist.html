<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WARCRAFT CHECKLIST</title>

<meta name="theme-color" content="#111111">

<!-- Favicon — stejné zlaté "W" jako v nadpisu webu -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2064%2064%27%3E%3Cdefs%3E%3ClinearGradient%20id%3D%27g%27%20x1%3D%270%27%20y1%3D%270%27%20x2%3D%270%27%20y2%3D%271%27%3E%3Cstop%20offset%3D%270%27%20stop-color%3D%27%23f5dfa0%27%2F%3E%3Cstop%20offset%3D%270.45%27%20stop-color%3D%27%23d6a84f%27%2F%3E%3Cstop%20offset%3D%271%27%20stop-color%3D%27%239c7327%27%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Crect%20width%3D%2764%27%20height%3D%2764%27%20rx%3D%2713%27%20fill%3D%27%2314151b%27%2F%3E%3Crect%20x%3D%272%27%20y%3D%272%27%20width%3D%2760%27%20height%3D%2760%27%20rx%3D%2711%27%20fill%3D%27none%27%20stroke%3D%27%237a5a24%27%20stroke-width%3D%273%27%2F%3E%3Crect%20x%3D%276%27%20y%3D%2716%27%20width%3D%2712%27%20height%3D%273.6%27%20rx%3D%271.2%27%20fill%3D%27url(%23g)%27%2F%3E%3Crect%20x%3D%2746%27%20y%3D%2716%27%20width%3D%2712%27%20height%3D%273.6%27%20rx%3D%271.2%27%20fill%3D%27url(%23g)%27%2F%3E%3Cpath%20d%3D%27M11%2018%20L21.5%2046%20L32%2028%20L42.5%2046%20L53%2018%27%20fill%3D%27none%27%20stroke%3D%27url(%23g)%27%20stroke-width%3D%276.5%27%20stroke-linejoin%3D%27miter%27%2F%3E%3C%2Fsvg%3E">


<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&display=swap');

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #0d0e12;
    color: #e4dfd2;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
    transition: background 0.5s ease, color 0.5s ease;
}

/* Dekorativní pozadí je v samostatné, k viewportu ukotvené
   vrstvě. Dřív bylo namalované přes celý (velmi dlouhý)
   dokument, takže se přechody roztahovaly a diagonální
   šrafování vytvářelo pruhy a artefakty — nejvíc v sekci
   MÉDIA, která je zdaleka nejdelší. */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: -1;
    pointer-events: none;
    background:
        radial-gradient(ellipse at 20% 0%, rgba(120, 40, 20, 0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 10%, rgba(20, 60, 90, 0.10) 0%, transparent 55%),
        #0d0e12;
    transition: background 0.5s ease;
}

.header {
    background:
        linear-gradient(180deg, rgba(90,30,15,0.35) 0%, rgba(13,14,18,0) 60%),
        #14151b;
    border-bottom: 3px solid #7a5a24;
    box-shadow: 0 2px 0 #2c220d, 0 4px 18px rgba(0,0,0,.5);
    position: relative;
    transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
}

.header::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -6px;
    height: 3px;
    background: linear-gradient(90deg, transparent, #d6a84f 20%, #f0d68a 50%, #d6a84f 80%, transparent);
    opacity: .8;
    transition: background 0.5s ease;
}

.header-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 26px 18px 20px;
    text-align: center;
}

h1 {
    margin: 0;
    font-family: 'Cinzel Decorative', 'Cinzel', Georgia, serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 1px;
    background: linear-gradient(180deg, #f5dfa0 0%, #d6a84f 45%, #9c7327 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 10px rgba(214,168,79,.15);
    transition: background 0.5s ease;
}

.subtitle {
    margin-top: 8px;
    color: #a89a78;
    font-size: 13px;
    letter-spacing: .5px;
    font-style: italic;
    transition: color 0.5s ease;
}

.progress-area {
    margin-top: 20px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
}

.progress-label {
    font-size: 11px;
    color: #7a7460;
    margin-bottom: 6px;
    text-align: center;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-family: 'Cinzel', Georgia, serif;
    transition: color 0.5s ease;
}

/* Rám XP baru — kovový okraj jako u WoW UI panelů */
.progress-bar {
    position: relative;
    height: 26px;
    background: linear-gradient(180deg, #120d05 0%, #1c1408 50%, #0c0904 100%);
    border: 2px solid #5c4a24;
    border-radius: 13px;
    overflow: hidden;
    box-shadow:
        inset 0 2px 5px rgba(0,0,0,.85),
        inset 0 -1px 0 rgba(255,255,255,.04),
        0 0 0 1px #241b0c,
        0 1px 0 rgba(255,255,255,.03);
    transition: background 0.5s ease, border-color 0.5s ease;
}

/* Vyplněná část — modrý XP gradient se sklem nahoře */
.progress-fill {
    position: relative;
    height: 100%;
    width: 0%;
    min-width: 0;
    background: linear-gradient(180deg, #9fe3ff 0%, #4fb0f0 18%, #1f78d6 55%, #164f9c 100%);
    box-shadow:
        0 0 12px rgba(79,176,240,.65),
        inset 0 1px 0 rgba(255,255,255,.5),
        inset 0 -2px 4px rgba(0,20,50,.5);
    transition: width .5s cubic-bezier(.22,.7,.2,1), background 0.5s ease, box-shadow 0.5s ease;
    border-radius: 11px;
}

/* Jemný lesklý pruh přes horní třetinu výplně */
.progress-fill::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 45%;
    background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0));
    border-radius: 11px 11px 0 0;
}

/* Dělicí rysky po 10 % jako na WoW liště zkušeností */
.progress-bar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: repeating-linear-gradient(
        90deg,
        rgba(0,0,0,.5) 0,
        rgba(0,0,0,.5) 1px,
        transparent 1px,
        transparent 10%
    );
    z-index: 2;
    pointer-events: none;
}

.progress-text {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .3px;
    color: #fff;
    text-shadow:
        0 1px 2px rgba(0,0,0,.9),
        0 0 6px rgba(0,0,0,.6);
    z-index: 3;
    pointer-events: none;
    font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
}

.loading-note {
    font-size: 12px;
    color: #7a7f89;
    margin-top: 6px;
}


/* =========================
   MAIN
========================= */

.main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 20px 18px 60px;
}


/* =========================
   COLLAPSIBLE SECTIONS
========================= */

.section {
    margin-bottom: 10px;
    background: linear-gradient(180deg, #1a1b21 0%, #17181d 100%);
    border: 1px solid #322818;
    border-radius: 5px;
    overflow: hidden;
    transition: background 0.5s ease, border-color 0.5s ease;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 16px;
    cursor: pointer;
    user-select: none;
    border-left: 3px solid transparent;
    transition: border-color .15s ease, background .15s ease;
}

.section-header:hover {
    background: #20242c;
    border-left-color: #d6a84f;
}

.section-title {
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: 14px;
    color: #d9cfb5;
    letter-spacing: .3px;
    transition: color 0.5s ease;
}

.section-count {
    color: #7a7460;
    font-size: 11px;
    margin-left: auto;
    letter-spacing: .3px;
    transition: color 0.5s ease;
}

.arrow {
    width: 9px;
    height: 9px;
    border-right: 2px solid #b08a3e;
    border-bottom: 2px solid #b08a3e;
    transform: rotate(45deg);
    transition: transform .2s ease, border-color 0.5s ease;
    margin-right: 3px;
}

.section.open > .section-header > .arrow {
    transform: rotate(225deg);
}

.section-content {
    display: none;
    padding: 0 12px 12px;
}

.section.open > .section-content {
    display: block;
}


/* =========================
   ITEMS
========================= */

.item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 9px 8px;
    border-top: 1px solid #24211a;
    line-height: 1.4;
    font-size: 14px;
    color: #c9c2ae;
    transition: border-color 0.5s ease, color 0.5s ease;
}

.item:first-child {
    border-top: 0;
}

.item input {
    flex: 0 0 auto;
    margin-top: 3px;
    width: 16px;
    height: 16px;
    accent-color: #d6a84f;
    cursor: pointer;
}

.item label {
    cursor: pointer;
    flex: 1;
}

.item.completed label {
    color: #625c4d;
    text-decoration: line-through;
}

/* =========================
   MEDIA
========================= */

.media-category {
    margin-bottom: 12px;
}

.media-category .section-title {
    font-size: 18px;
    color: #f0d68a;
    display: flex;
    align-items: center;
    gap: 10px;
}

.category-icon {
    flex: 0 0 auto;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, #23262f 0%, #14151b 75%);
    border: 1.5px solid #6e5223;
    border-radius: 6px;
    box-shadow:
        inset 0 0 4px rgba(0,0,0,.6),
        0 0 6px rgba(214,168,79,.25);
    transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
}

.category-icon svg {
    width: 15px;
    height: 15px;
    display: block;
}

.media-category > .section {
    border-color: #4a3a18;
}

/* Skupiny vnořené v kategorii nesmí opakovat stejný svislý
   přechod jako rodičovský panel — vznikaly tím světlejší
   obdélníky, které vypadaly jako poškozené pozadí.
   Uvnitř proto plná barva. */
.media-category .section-content .section {
    background: #191a20;
}


/* =========================
   DOKONČENÁ SEKCE
========================= */

.check {
    display: none;
    flex: 0 0 auto;
    width: 17px;
    height: 17px;
    line-height: 17px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: #0d0e12;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 9px rgba(74, 222, 128, .45);
}

.section.complete > .section-header > .check {
    display: block;
}

.section.complete > .section-header > .section-title {
    color: #4ade80;
}

.section.complete > .section-header {
    border-left-color: #4ade80;
}


/* =========================
   FOOTER & THEME SELECTOR
========================= */

.footer {
    border-top: 2px solid #3a2e18;
    background: #0f1015;
    padding: 30px 18px 40px;
    text-align: center;
    position: relative;
    transition: background 0.5s ease, border-color 0.5s ease;
}

.footer::before {
    content: "";
    position: absolute;
    top: -4px;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, #d6a84f 50%, transparent);
    opacity: 0.6;
    transition: background 0.5s ease;
}

.theme-title {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #8c7e62;
    margin-bottom: 18px;
    transition: color 0.5s ease;
}

.faction-container {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
}

.faction-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    background: rgba(20, 22, 30, 0.7);
    border: 2px solid #4a3a1d;
    border-radius: 10px;
    padding: 12px 20px;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    user-select: none;
    width: 140px;
}

.faction-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 1;
}

.faction-card:hover {
    transform: translateY(-4px) scale(1.03);
}

.faction-card.alliance:hover, .faction-card.alliance.active {
    border-color: #3b82f6;
    box-shadow: 0 0 18px rgba(59, 130, 246, 0.4), inset 0 0 10px rgba(59, 130, 246, 0.2);
}

.faction-card.horde:hover, .faction-card.horde.active {
    border-color: #ef4444;
    box-shadow: 0 0 18px rgba(239, 68, 68, 0.4), inset 0 0 10px rgba(239, 68, 68, 0.2);
}

.faction-card.neutral:hover, .faction-card.neutral.active {
    border-color: #eab308;
    box-shadow: 0 0 18px rgba(234, 179, 8, 0.4), inset 0 0 10px rgba(234, 179, 8, 0.2);
}

.faction-icon {
    width: 54px;
    height: 54px;
    position: relative;
    z-index: 2;
    transition: transform 0.3s ease;
}

.faction-card:hover .faction-icon {
    transform: scale(1.1);
}

.faction-name {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 13px;
    font-weight: 700;
    margin-top: 8px;
    letter-spacing: 1px;
    z-index: 2;
}

.faction-card.alliance .faction-name { color: #60a5fa; }
.faction-card.horde .faction-name { color: #f87171; }
.faction-card.neutral .faction-name { color: #facc15; }

.faction-status {
    font-size: 10px;
    color: #888;
    margin-top: 2px;
    z-index: 2;
    font-style: italic;
}


/* =========================
   THEME STYLES — ALLIANCE
========================= */

body.theme-alliance {
    background: #090e17;
    color: #e2e8f0;
}

body.theme-alliance::before {
    background:
        radial-gradient(ellipse at 20% 0%, rgba(30, 80, 160, 0.22) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(200, 160, 60, 0.12) 0%, transparent 55%),
        repeating-linear-gradient(45deg, rgba(20, 40, 80, 0.03) 0px, rgba(20, 40, 80, 0.03) 2px, transparent 2px, transparent 8px),
        #090e17;
}

body.theme-alliance .header {
    background: linear-gradient(180deg, rgba(15, 35, 75, 0.85) 0%, rgba(9, 14, 23, 0.95) 100%), #0d1527;
    border-bottom: 3px solid #2563eb;
    box-shadow: 0 2px 0 #1e3a8a, 0 4px 20px rgba(37, 99, 235, 0.25);
}

body.theme-alliance .header::after {
    background: linear-gradient(90deg, transparent, #3b82f6 20%, #f59e0b 50%, #3b82f6 80%, transparent);
}

body.theme-alliance h1 {
    background: linear-gradient(180deg, #ffffff 0%, #93c5fd 40%, #2563eb 85%, #1e40af 100%);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
}

body.theme-alliance .subtitle {
    color: #93c5fd;
}

body.theme-alliance .progress-label {
    color: #60a5fa;
}

body.theme-alliance .progress-bar {
    background: linear-gradient(180deg, #070c14 0%, #0f1d36 50%, #050a12 100%);
    border: 2px solid #2563eb;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.85), 0 0 8px rgba(37,99,235,.4);
}

body.theme-alliance .progress-fill {
    background: linear-gradient(180deg, #fef08a 0%, #eab308 30%, #ca8a04 70%, #854d0e 100%);
    box-shadow: 0 0 14px rgba(234, 179, 8, 0.7), inset 0 1px 0 rgba(255,255,255,.6);
}

body.theme-alliance .section {
    background: linear-gradient(180deg, #111a2e 0%, #0d1424 100%);
    border: 1px solid #1e3a8a;
}

body.theme-alliance .media-category .section-content .section {
    background: #0f172a;
}

body.theme-alliance .section-header:hover {
    background: #1e293b;
    border-left-color: #3b82f6;
}

body.theme-alliance .section-title {
    color: #e0f2fe;
}

body.theme-alliance .media-category .section-title {
    color: #93c5fd;
}

body.theme-alliance .section-count {
    color: #64748b;
}

body.theme-alliance .arrow {
    border-color: #3b82f6;
}

body.theme-alliance .item {
    border-top-color: #1e293b;
    color: #cbd5e1;
}

body.theme-alliance .item input {
    accent-color: #3b82f6;
}

body.theme-alliance .item.completed label {
    color: #475569;
}

body.theme-alliance .category-icon {
    background: radial-gradient(circle at 35% 30%, #1e293b 0%, #0f172a 75%);
    border-color: #3b82f6;
    box-shadow: inset 0 0 4px rgba(0,0,0,.6), 0 0 8px rgba(59, 130, 246, 0.4);
}

body.theme-alliance .footer {
    background: #070a12;
    border-top-color: #1e3a8a;
}

body.theme-alliance .footer::before {
    background: linear-gradient(90deg, transparent, #3b82f6 50%, transparent);
}

body.theme-alliance .theme-title {
    color: #60a5fa;
}


/* =========================
   THEME STYLES — HORDE
========================= */

body.theme-horde {
    background: #140808;
    color: #f3d8d8;
}

body.theme-horde::before {
    background:
        radial-gradient(ellipse at 20% 0%, rgba(180, 20, 20, 0.25) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 80%, rgba(90, 10, 10, 0.2) 0%, transparent 55%),
        repeating-linear-gradient(-45deg, rgba(80, 10, 10, 0.04) 0px, rgba(80, 10, 10, 0.04) 3px, transparent 3px, transparent 10px),
        #140808;
}

body.theme-horde .header {
    background: linear-gradient(180deg, rgba(80, 10, 10, 0.85) 0%, rgba(20, 8, 8, 0.95) 100%), #1c0a0a;
    border-bottom: 3px solid #dc2626;
    box-shadow: 0 2px 0 #7f1d1d, 0 4px 20px rgba(220, 38, 38, 0.3);
}

body.theme-horde .header::after {
    background: linear-gradient(90deg, transparent, #ef4444 20%, #f97316 50%, #ef4444 80%, transparent);
}

body.theme-horde h1 {
    background: linear-gradient(180deg, #fef2f2 0%, #fca5a5 35%, #dc2626 80%, #7f1d1d 100%);
    -webkit-background-clip: text;
    background-clip: text;
    text-shadow: 0 0 15px rgba(220, 38, 38, 0.5);
}

body.theme-horde .subtitle {
    color: #fca5a5;
}

body.theme-horde .progress-label {
    color: #ef4444;
}

body.theme-horde .progress-bar {
    background: linear-gradient(180deg, #120404 0%, #2a0808 50%, #0a0202 100%);
    border: 2px solid #b91c1c;
    box-shadow: inset 0 2px 5px rgba(0,0,0,.85), 0 0 8px rgba(185, 28, 28, 0.4);
}

body.theme-horde .progress-fill {
    background: linear-gradient(180deg, #fca5a5 0%, #ef4444 30%, #b91c1c 70%, #7f1d1d 100%);
    box-shadow: 0 0 14px rgba(239, 68, 68, 0.8), inset 0 1px 0 rgba(255,255,255,.5);
}

body.theme-horde .section {
    background: linear-gradient(180deg, #240d0d 0%, #1a0a0a 100%);
    border: 1px solid #7f1d1d;
}

body.theme-horde .media-category .section-content .section {
    background: #1f0b0b;
}

body.theme-horde .section-header:hover {
    background: #361212;
    border-left-color: #ef4444;
}

body.theme-horde .section-title {
    color: #fee2e2;
}

body.theme-horde .media-category .section-title {
    color: #fca5a5;
}

body.theme-horde .section-count {
    color: #9f1239;
}

body.theme-horde .arrow {
    border-color: #ef4444;
}

body.theme-horde .item {
    border-top-color: #361212;
    color: #fecdd3;
}

body.theme-horde .item input {
    accent-color: #ef4444;
}

body.theme-horde .item.completed label {
    color: #7f1d1d;
}

body.theme-horde .category-icon {
    background: radial-gradient(circle at 35% 30%, #361212 0%, #1a0a0a 75%);
    border-color: #ef4444;
    box-shadow: inset 0 0 4px rgba(0,0,0,.6), 0 0 8px rgba(239, 68, 68, 0.4);
}

body.theme-horde .footer {
    background: #0d0404;
    border-top-color: #7f1d1d;
}

const THEME_KEY = "warcraft_theme_preference";

function setTheme(theme) {
    document.body.classList.remove("theme-alliance", "theme-horde");

    document.getElementById("btnAlliance").classList.remove("active");
    document.getElementById("btnHorde").classList.remove("active");
    document.getElementById("btnNeutral").classList.remove("active");

    const metaTheme = document.querySelector('meta[name="theme-color"]');

    if (theme === "alliance") {
        document.body.classList.add("theme-alliance");
        document.getElementById("btnAlliance").classList.add("active");
        if (metaTheme) metaTheme.setAttribute("content", "#090e17");
    } else if (theme === "horde") {
        document.body.classList.add("theme-horde");
        document.getElementById("btnHorde").classList.add("active");
        if (metaTheme) metaTheme.setAttribute("content", "#140808");
    } else {
        document.getElementById("btnNeutral").classList.add("active");
        if (metaTheme) metaTheme.setAttribute("content", "#111111");
    }

    try {
        window.localStorage.setItem(THEME_KEY, theme);
    } catch (e) {
        console.error("Uložení tématu se nezdařilo:", e);
    }
}

function loadSavedTheme() {
    try {
        const savedTheme = window.localStorage.getItem(THEME_KEY);
        if (savedTheme) {
            setTheme(savedTheme);
        }
    } catch (e) {
        console.error("Načtení tématu se nezdařilo:", e);
    }
}


/* =========================================================
   CHECKBOX STORAGE (persistuje mezi sezeními, jen pro tebe)
========================================================= */

const STORAGE_KEY = "warcraft_storyline_checked_v1";

let checkedItems = {};
let storageReady = false;


async function loadCheckedItems() {

    try {

        const raw = window.localStorage.getItem(STORAGE_KEY);

        checkedItems = raw ? JSON.parse(raw) : {};

    } catch (err) {

        checkedItems = {};

    }

    storageReady = true;

}


async function saveCheckedItems() {

    try {

        window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(checkedItems)
        );

    } catch (err) {

        console.error("Uložení se nezdařilo:", err);

    }

}


/* =========================================================
   CHECKBOX
========================================================= */

function makeId(text) {

    return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[̀-ͯ]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");

}


// Registr všech DOM instancí dané položky, aby se
// zaškrtnutí propsalo okamžitě všude.
let itemRegistry = {};
let idCounters = {};

// Registr sekcí (kategorie a skupiny v médiích), aby
// šlo označit zelenou fajfkou tu, která je celá hotová.
let groupRegistry = [];


function registerGroup(element, ids) {

    if (!ids.length) {
        return;
    }

    groupRegistry.push({
        element: element,
        ids: ids
    });

}


function updateGroupStates() {

    groupRegistry.forEach(function(group) {

        const done = group.ids.every(function(id) {
            return !!checkedItems[id];
        });

        group.element.classList.toggle("complete", done);

    });

}

function createCategoryIcon(iconName) {

    const wrapper = document.createElement("span");

    wrapper.className = "category-icon";

    const svgMarkup =
        '<svg viewBox="0 0 24 24">' +
        (CATEGORY_ICONS[iconName] || "") +
        "</svg>";

    wrapper.innerHTML = svgMarkup;

    return wrapper;

}


function createCheckMark() {

    const check = document.createElement("div");

    check.className = "check";

    check.textContent = "✓";

    check.title = "Vše dokončeno";

    return check;

}


function createItem(text) {

    const id = makeId(text);

    if (!itemRegistry[id]) {
        itemRegistry[id] = [];
        idCounters[id] = 0;
    }

    idCounters[id]++;

    const wrapper = document.createElement("div");

    wrapper.className = "item";

    if (checkedItems[id]) {
        wrapper.classList.add("completed");
    }

    const checkbox = document.createElement("input");

    checkbox.type = "checkbox";

    checkbox.checked = !!checkedItems[id];

    // Unikátní DOM id, protože stejná položka se může
    // objevit ve více pohledech současně.
    checkbox.id = "check-" + id + "-" + idCounters[id];

    checkbox.addEventListener("change", function() {

        setChecked(id, checkbox.checked);

    });


    const label = document.createElement("label");

    label.htmlFor = checkbox.id;

    label.textContent = text;


    wrapper.appendChild(checkbox);
    wrapper.appendChild(label);

    itemRegistry[id].push({
        wrapper: wrapper,
        checkbox: checkbox
    });

    return wrapper;

}


function setChecked(id, value) {

    checkedItems[id] = value;

    saveCheckedItems();

    (itemRegistry[id] || []).forEach(function(entry) {

        entry.checkbox.checked = value;

        entry.wrapper.classList.toggle(
            "completed",
            value
        );

    });

    updateProgress();

    updateGroupStates();

}


/* =========================================================
   GENERIC SECTION (rekurzivní — podporuje vnořené skupiny)
========================================================= */

// Node je buď list ({ items: [...] }), nebo uzel s dalšími
// vnořenými skupinami ({ groups: [...] }).
function collectIds(node) {

    if (node.items) {
        return node.items.map(makeId);
    }

    return (node.groups || []).reduce(function(ids, group) {

        return ids.concat(collectIds(group));

    }, []);

}


function createSection(title, node) {

    const section = document.createElement("div");

    section.className = "section";


    const header = document.createElement("div");

    header.className = "section-header";


    const titleEl = document.createElement("div");

    titleEl.className = "section-title";

    titleEl.textContent = title;


    const ids = collectIds(node);

    const count = document.createElement("div");

    count.className = "section-count";

    count.textContent = ids.length + " položek";


    const arrow = document.createElement("div");

    arrow.className = "arrow";


    header.appendChild(createCheckMark());
    header.appendChild(titleEl);
    header.appendChild(count);
    header.appendChild(arrow);


    const content = document.createElement("div");

    content.className = "section-content";


    if (node.items) {

        node.items.forEach(function(item) {

            content.appendChild(
                createItem(item)
            );

        });

    } else {

        (node.groups || []).forEach(function(group) {

            content.appendChild(
                createSection(group.title, group)
            );

        });

    }


    header.addEventListener("click", function() {

        const willOpen = !section.classList.contains("open");

        section.classList.toggle("open", willOpen);

        // Při zavření kategorie se zavřou i všechny
        // vnořené podkategorie, aby se příště otevřela
        // vždy sbalená.
        if (!willOpen) {

            content
                .querySelectorAll(".section.open")
                .forEach(function(sub) {

                    sub.classList.remove("open");

                });

        }

    });


    section.appendChild(header);
    section.appendChild(content);

    registerGroup(section, ids);

    return section;

}


/* =========================================================
   RENDER MÉDIA
========================================================= */

function renderMedia() {

    const container =
        document.getElementById("mediaContainer");

    container.innerHTML = "";


    mediaData.forEach(function(category) {

        const categorySection =
            document.createElement("div");

        categorySection.className =
            "media-category";


        const section =
            document.createElement("div");

        section.className = "section";


        const header =
            document.createElement("div");

        header.className =
            "section-header";


        const title =
            document.createElement("div");

        title.className =
            "section-title";

        title.appendChild(
            createCategoryIcon(category.icon)
        );

        title.appendChild(
            document.createTextNode(category.title)
        );


        const total =
            category.groups.reduce(
                (sum, group) =>
                    sum + collectIds(group).length,
                0
            );


        const count =
            document.createElement("div");

        count.className =
            "section-count";

        count.textContent =
            total + " položek";


        const arrow =
            document.createElement("div");

        arrow.className =
            "arrow";


        header.appendChild(createCheckMark());
        header.appendChild(title);
        header.appendChild(count);
        header.appendChild(arrow);


        const content =
            document.createElement("div");

        content.className =
            "section-content";


        // Kategorie s jedinou skupinou by jinak měla
        // zbytečnou podkategorii se stejným názvem —
        // položky proto vypíšeme rovnou (pokud jde o
        // plochý seznam a ne o další vnořené skupiny).
        if (category.groups.length === 1 && category.groups[0].items) {

            category.groups[0].items
                .forEach(function(item) {

                    content.appendChild(
                        createItem(item)
                    );

                });

        } else {

            category.groups.forEach(function(group) {

                const groupSection =
                    createSection(
                        group.title,
                        group
                    );

                content.appendChild(
                    groupSection
                );

            });

        }


        header.addEventListener(
            "click",
            function() {

                const willOpen =
                    !section.classList.contains("open");

                section.classList.toggle(
                    "open",
                    willOpen
                );

                if (!willOpen) {

                    content
                        .querySelectorAll(".section.open")
                        .forEach(function(sub) {

                            sub.classList.remove("open");

                        });

                }

            }
        );


        section.appendChild(header);
        section.appendChild(content);

        registerGroup(
            section,
            category.groups.reduce(
                (ids, group) =>
                    ids.concat(collectIds(group)),
                []
            )
        );

        categorySection.appendChild(section);

        container.appendChild(categorySection);

    });

}


/* =========================================================
   PROGRESS
========================================================= */

function updateProgress() {

    const ids = Object.keys(itemRegistry);

    const total = ids.length;

    let completed = 0;

    ids.forEach(function(id) {

        if (checkedItems[id]) {
            completed++;
        }

    });


    const percentage =
        total === 0
            ? 0
            : Math.round(
                completed / total * 100
            );


    document.getElementById(
        "progressText"
    ).textContent =
        completed +
        " / " +
        total +
        " dokončeno";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage + "%";

}


/* =========================================================
   RENDER ALL (čistí registr, aby se nekumulovaly staré
   odkazy na smazané DOM elementy)
========================================================= */

function renderAll() {

    itemRegistry = {};
    idCounters = {};
    groupRegistry = [];

    renderMedia();
    updateProgress();
    updateGroupStates();

}


/* =========================================================
   INIT
========================================================= */

async function init() {

    await loadCheckedItems();

    renderAll();
    loadSavedTheme();

}

init();
